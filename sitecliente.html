<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rift - Runner</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">
        <div class="scanline"></div>

        <main class="content">
            <h1 class="title"> <img src="img/NEONRIFT.png" alt="Logo do Site" class="logo-img"> </h1>

            <div class="actions">
                <span>HACKEIE!</span>
                <span class="separator">/</span>
                <span>CORRA!</span>
            </div>

            <p class="description">
                Em NEON RIFT, você decide o <br>
                <strong>seu próprio destino de Runner!</strong>
            </p>

            <a href="https://trex-runner.com/" target="_blank" rel="noopener noreferrer">
                <button id="playBtn" class="btn-main">JOGUE AGORA!</button>
            </a>
        </main>

        <footer class="store-footer">
            <a href="https://store.steampowered.com/" target="_blank" rel="noopener noreferrer" class="btn-store">
                <button class="fa-brands fa-steam"></button> STEAM
            </a>
            <a href="https://store.epicgames.com/" target="_blank" rel="noopener noreferrer" class="btn-store">
                <button class="fa-solid fa-e"></button> EPIC GAMES
            </a>
        </footer>
    </div>

    <script>
        const btn = document.getElementById('playBtn');
        btn.addEventListener('click', () => {
            alert('INICIANDO O JOGO...');
        });

        // Efeito simples de cintilância no título
        setInterval(() => {
            const title = document.querySelector('.title');
            title.style.opacity = Math.random() > 0.98 ? '0.5' : '1';
        }, 50);
    </script>
</body>

</html>
